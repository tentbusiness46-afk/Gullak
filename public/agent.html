<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gullak Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green-deep:#014630;
  --green:#016F48;
  --yellow:#F6ED07;
  --yellow-dark:#C9A227;
  --cream:#F6F4EC;
  --ink:#0E1F18;
  --border:rgba(14,31,24,0.09);
  --muted:rgba(14,31,24,0.5);
  --red:#DB4C3F;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--cream);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit}

/* ---------------- login ---------------- */
.login-shell{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--green-deep);padding:24px;
}
.login-card{
  width:100%;max-width:380px;background:#fff;border-radius:20px;padding:36px 32px;
}
.login-logo{width:60px;height:59px;position:relative;margin:0 auto 18px;border-radius:16px;overflow:hidden}
.login-logo .sq{position:absolute;inset:0;background:var(--green)}
.login-logo img{position:absolute;left:15%;top:19%;width:70%}
.login-logo .coin{position:absolute;left:67%;top:10%;width:21%}
.login-title{
  text-align:center;font-family:'Bricolage Grotesque',sans-serif;font-size:21px;font-weight:800;color:var(--ink);
}
.login-sub{text-align:center;margin-top:4px;font-size:13px;color:var(--muted)}
.login-form{margin-top:26px;display:flex;flex-direction:column;gap:16px}
.field-label{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field-input{
  width:100%;height:46px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--cream);padding:0 14px;font-size:14.5px;color:var(--ink);outline:none;
}
.field-input:focus{border-color:var(--green)}
.field-input.input-error{border-color:var(--red)}
.field-error{margin-top:6px;font-size:12px;color:var(--red);display:none}
.field-error.show{display:block}
.login-btn{
  margin-top:6px;height:48px;border-radius:12px;background:var(--yellow);color:var(--ink);
  border:none;font-size:15px;font-weight:700;cursor:pointer;
}
.login-btn:active{opacity:.9}
.login-error{margin-top:2px;font-size:12.5px;color:var(--red);display:none}
.login-error.show{display:block}
.login-hint{
  margin-top:22px;background:var(--cream);border-radius:12px;padding:12px 14px;
  font-size:12px;line-height:1.6;color:var(--muted);text-align:center;
}
.login-hint b{color:var(--ink)}

/* ---------------- dashboard shell ---------------- */
.db-shell{min-height:100vh;display:flex}
.db-sidebar{
  width:230px;flex:none;background:var(--green-deep);color:#fff;
  display:flex;flex-direction:column;padding:22px 16px;
}
.db-brand{display:flex;align-items:center;gap:10px;padding:0 4px 22px}
.db-brand .logo{width:36px;height:35px;position:relative;border-radius:10px;overflow:hidden;flex:none}
.db-brand .logo .sq{position:absolute;inset:0;background:var(--green)}
.db-brand .logo img{position:absolute;left:15%;top:19%;width:70%}
.db-brand .logo .coin{position:absolute;left:67%;top:-10%;width:21%}
.db-brand-text{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:16px;line-height:1.15}
.db-brand-text span{display:block;font-family:'Inter',sans-serif;font-weight:500;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,0.5)}

.db-nav{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.db-nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;
  cursor:pointer;font-size:14px;font-weight:600;color:rgba(255,255,255,0.7);
}
.db-nav-item svg{width:18px;height:18px;flex:none}
.db-nav-item.active{background:rgba(255,255,255,0.12);color:#fff}
.db-nav-item:hover{color:#fff}

.db-sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,0.12)}
.db-user-chip{display:flex;align-items:center;gap:10px;padding:6px 4px}
.db-user-avatar{
  width:34px;height:34px;border-radius:50%;background:var(--yellow);color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;
  font-weight:700;font-size:13px;flex:none;
}
.db-user-name{font-size:13px;font-weight:700}
.db-user-role{font-size:11px;color:rgba(255,255,255,0.5)}
.db-logout{
  margin-top:12px;width:100%;height:38px;border-radius:10px;background:rgba(255,255,255,0.08);
  border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;
}
.db-logout:active{opacity:.85}

.db-main{flex:1;min-width:0;padding:28px 32px 60px;overflow-x:hidden}
.db-topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.db-page-title{font-family:'Bricolage Grotesque',sans-serif;font-size:23px;font-weight:800}
.db-page-sub{margin-top:3px;font-size:13px;color:var(--muted)}

.db-btn{
  height:42px;padding:0 18px;border-radius:11px;background:var(--green);color:#fff;
  border:none;font-size:13.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
}
.db-btn:active{opacity:.9}
.db-btn svg{width:16px;height:16px}
.db-btn.secondary{background:#fff;color:var(--ink);border:1.5px solid var(--border)}

/* mobile hamburger, hidden on desktop */
.db-hamburger{
  display:none;width:38px;height:38px;border-radius:10px;background:#fff;border:1.5px solid var(--border);
  align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--ink);
}
.db-hamburger svg{width:18px;height:18px}
.db-topbar-mobile{display:none;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--green-deep);color:#fff}
.db-topbar-mobile .db-brand{padding:0}
.db-topbar-mobile .db-brand-text{font-size:15px}

/* ---------------- stat cards ---------------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px}
.stat-label{font-size:12px;color:var(--muted);font-weight:600}
.stat-value{margin-top:6px;font-family:'Bricolage Grotesque',sans-serif;font-size:25px;font-weight:800}
.stat-sub{margin-top:4px;font-size:11.5px;color:var(--muted)}

.plan-breakdown{margin-top:22px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px}
.plan-breakdown-title{font-family:'Bricolage Grotesque',sans-serif;font-size:16px;font-weight:700}
.plan-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border)}
.plan-row:first-of-type{border-top:none;margin-top:12px}
.plan-row-name{font-size:13.5px;font-weight:700}
.plan-row-count{font-size:11.5px;color:var(--muted);margin-top:2px}
.plan-row-amount{font-family:'Bricolage Grotesque',sans-serif;font-size:15px;font-weight:700;color:var(--green)}

/* ---------------- content cards / sections ---------------- */
.db-section{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;margin-top:20px}
.db-section:first-child{margin-top:0}
.db-section-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.db-section-title{font-family:'Bricolage Grotesque',sans-serif;font-size:16px;font-weight:700}

/* ---------------- tables ---------------- */
.table-wrap{overflow-x:auto}
.data-table{width:100%;border-collapse:collapse;min-width:560px}
.data-table th{
  text-align:left;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);padding:0 12px 10px;white-space:nowrap;
}
.data-table td{padding:13px 12px;border-top:1px solid var(--border);font-size:13.5px;white-space:nowrap}
.data-table tbody tr{cursor:pointer}
.data-table tbody tr:hover{background:var(--cream)}
.data-table td.name-cell{font-weight:700}
.table-tag{
  display:inline-flex;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;
  background:var(--cream);color:var(--green);
}
.table-tag.muted{color:var(--muted);background:var(--cream)}
.empty-row td{text-align:center;color:var(--muted);padding:30px 12px;cursor:default}
.empty-row:hover{background:none !important}

/* ---------------- modal ---------------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(14,31,24,0.55);display:none;
  align-items:center;justify-content:center;padding:20px;z-index:100;
}
.modal-overlay.open{display:flex}
.modal-card{
  width:100%;max-width:440px;max-height:88vh;overflow-y:auto;background:#fff;border-radius:18px;padding:24px;
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-title{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:700}
.modal-close{
  width:30px;height:30px;border-radius:50%;background:var(--cream);border:none;color:var(--ink);
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;
}
.modal-close svg{width:15px;height:15px}
.modal-form{display:flex;flex-direction:column;gap:14px}
.modal-submit{
  margin-top:4px;height:46px;border-radius:12px;background:var(--yellow);color:var(--ink);
  border:none;font-size:14.5px;font-weight:700;cursor:pointer;
}
.modal-submit:active{opacity:.9}
.modal-error{font-size:12.5px;color:var(--red);display:none}
.modal-error.show{display:block}

/* ---------------- profile pages (open in new tab) ---------------- */
.profile-shell{max-width:820px;margin:0 auto;padding:32px 24px 60px}
.profile-back{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);
  cursor:pointer;background:none;border:none;
}
.profile-back svg{width:15px;height:15px}
.profile-head{
  margin-top:18px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:24px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.profile-avatar{
  width:58px;height:58px;border-radius:50%;background:var(--green);color:var(--yellow);
  display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;
  font-weight:800;font-size:20px;flex:none;
}
.profile-name{font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:800}
.profile-meta{margin-top:3px;font-size:13px;color:var(--muted)}

.profile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:18px}
.profile-stat{background:#fff;border:1px solid var(--border);border-radius:14px;padding:15px}
.profile-stat-label{font-size:11.5px;color:var(--muted)}
.profile-stat-value{margin-top:5px;font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:800}

/* ---------------- agent: today's collection list ---------------- */
.collect-row{
  display:flex;align-items:center;gap:12px;padding:14px 4px;border-top:1px solid var(--border);flex-wrap:wrap;
}
.collect-row:first-of-type{border-top:none}
.collect-avatar{
  width:38px;height:38px;border-radius:50%;background:var(--green);color:var(--yellow);
  display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;
  font-weight:700;font-size:12.5px;flex:none;
}
.collect-text{flex:1;min-width:150px}
.collect-name{font-size:13.5px;font-weight:700}
.collect-meta{margin-top:2px;font-size:11.5px;color:var(--muted)}
.collect-actions{display:flex;gap:8px;flex:none}
.collect-btn{
  height:36px;padding:0 14px;border-radius:9px;border:1.5px solid var(--border);background:#fff;
  font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted);
}
.collect-btn.paid.active{background:var(--green);border-color:var(--green);color:#fff}
.collect-btn.missed.active{background:var(--red);border-color:var(--red);color:#fff}

/* ---------------- responsive ---------------- */
@media (max-width:860px){
  .db-sidebar{display:none}
  .db-topbar-mobile{display:flex}
  .db-hamburger{display:flex}
  .db-main{padding:20px 16px 50px}
  .db-shell{flex-direction:column}
  .db-shell.nav-open .db-sidebar{
    display:flex;width:100%;flex-direction:column;position:relative;
  }
  .data-table{min-width:480px}
}

</style>
</head>

<script>
/* ============================================================
   Gullak agent dashboard - talks to the real backend at /agent/api/*.
   See docs/API_REFERENCE.md for every endpoint used here.
   ============================================================ */
(function () {
  function apiFetch(path, options) {
    options = options || {};
    var headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
    return fetch(path, {
      method: options.method || 'GET',
      headers: headers,
      credentials: 'same-origin',
      body: options.body
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) {
          var err = new Error(data.error || ('Request failed (' + res.status + ')'));
          err.status = res.status;
          err.data = data;
          throw err;
        }
        return data;
      });
    });
  }

  var PLAN_LABELS = { daily: 'Daily Investment Plan', monthly: 'Monthly Investment Plan', fixed: 'Fixed Investment Plan' };
  var PLAN_UNIT = { daily: '/ day', monthly: '/ month', fixed: 'one-time' };
  function formatINR(n) {
    n = Math.round(n);
    return '\u20B9' + n.toLocaleString('en-IN');
  }

  // ---------------- generic form flow: Enter cycles to the next field,
  // Ctrl+Enter submits immediately, and every field shows its own red
  // error text (no native browser validation bubbles) ----------------
  function setupFormFlow(formEl, fieldConfigs, onValidSubmit) {
    function validateOne(cfg) {
      var val = cfg.input.value.trim();
      var ok = cfg.validate ? cfg.validate(val) : val.length > 0;
      cfg.input.classList.toggle('input-error', !ok);
      if (cfg.error) {
        cfg.error.textContent = cfg.message || 'This field is required.';
        cfg.error.classList.toggle('show', !ok);
      }
      return ok;
    }
    function validateAll() {
      var allOk = true, firstInvalid = null;
      fieldConfigs.forEach(function (cfg) {
        var ok = validateOne(cfg);
        if (!ok) { allOk = false; if (!firstInvalid) firstInvalid = cfg.input; }
      });
      if (firstInvalid) firstInvalid.focus();
      return allOk;
    }
    fieldConfigs.forEach(function (cfg, idx) {
      cfg.input.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        if (e.ctrlKey || e.metaKey) {
          if (validateAll()) onValidSubmit();
          return;
        }
        if (!validateOne(cfg)) return;
        if (idx < fieldConfigs.length - 1) fieldConfigs[idx + 1].input.focus();
        else if (validateAll()) onValidSubmit();
      });
      cfg.input.addEventListener('input', function () {
        if (cfg.input.classList.contains('input-error')) validateOne(cfg);
      });
    });
    formEl.setAttribute('novalidate', 'novalidate');
    formEl.addEventListener('submit', function (e) {
      e.preventDefault();
      if (validateAll()) onValidSubmit();
    });
    formEl._validateAll = validateAll;
  }
  function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  function show(id) {
    ['loginScreen', 'dashboardScreen'].forEach(function (s) {
      document.getElementById(s).style.display = (s === id) ? '' : 'none';
    });
  }
  function initial(name) { return (name || '?').trim().charAt(0).toUpperCase(); }
  function statCard(label, value, sub) {
    return '<div class="stat-card"><div class="stat-label">' + label + '</div>' +
      '<div class="stat-value">' + value + '</div><div class="stat-sub">' + sub + '</div></div>';
  }
  function uniqueCustomerCount(data) {
    var ids = {};
    (data.recurring || []).forEach(function (r) { ids[r.userId] = true; });
    (data.oneTime || []).forEach(function (r) { ids[r.userId] = true; });
    return Object.keys(ids).length;
  }

  function route() {
    apiFetch('/agent/api/me').then(function (agent) {
      show('dashboardScreen');
      renderAgentDashboard(agent);
    }).catch(function () {
      show('loginScreen');
    });
  }

  var loginEmailInput = document.getElementById('loginEmail');
  var loginPasswordInput = document.getElementById('loginPassword');
  function doAgentLogin() {
    var email = loginEmailInput.value.trim();
    var pass = loginPasswordInput.value;
    document.getElementById('loginError').classList.remove('show');
    apiFetch('/agent/api/login', { method: 'POST', body: JSON.stringify({ email: email, password: pass }) })
      .then(function (agent) {
        show('dashboardScreen');
        renderAgentDashboard(agent);
      })
      .catch(function () {
        document.getElementById('loginError').classList.add('show');
      });
  }
  setupFormFlow(document.getElementById('loginForm'), [
    { input: loginEmailInput, error: document.getElementById('loginEmailError'), validate: isValidEmail, message: 'Please enter a valid email address' },
    { input: loginPasswordInput, error: document.getElementById('loginPasswordError'), validate: function (v) { return v.length > 0; }, message: 'Please enter your password' }
  ], doAgentLogin);
  function doLogout() {
    apiFetch('/agent/api/logout', { method: 'POST' }).then(route).catch(route);
  }
  document.getElementById('logoutBtn').addEventListener('click', doLogout);
  document.getElementById('mobileLogoutBtn').addEventListener('click', doLogout);

  function renderAgentDashboard(agent) {
    document.getElementById('agentInitial').textContent = initial(agent.name);
    document.getElementById('agentNameLabel').textContent = agent.name;
    document.getElementById('greetTitle').textContent = 'Namaste, ' + agent.name.split(' ')[0] + '!';
    document.getElementById('todayLabel').textContent = 'Today \u2014 ' + new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });

    apiFetch('/agent/api/customers').then(function (data) {
      var recurring = data.recurring || [];
      var oneTime = data.oneTime || [];

      var paidCount = 0, pendingCount = 0;
      recurring.forEach(function (r) {
        if (r.todayStatus === 'paid') paidCount++;
        else if (r.todayStatus === 'pending') pendingCount++;
      });

      document.getElementById('agentStatGrid').innerHTML =
        statCard('Total Customers', uniqueCustomerCount(data), 'assigned to you') +
        statCard('Collected Today', paidCount + ' / ' + recurring.length, 'recurring customers') +
        statCard('Pending Today', pendingCount, 'not yet marked');

      var listHtml = recurring.length ? recurring.map(function (r) {
        var status = r.todayStatus === 'pending' ? null : r.todayStatus;
        return '<div class="collect-row" data-plan-id="' + r.planId + '">' +
          '<div class="collect-avatar">' + initial(r.userName) + '</div>' +
          '<div class="collect-text"><div class="collect-name">' + r.userName + '</div>' +
          '<div class="collect-meta">' + PLAN_LABELS[r.type] + ' \u00b7 ' + formatINR(r.amount) + ' ' + PLAN_UNIT[r.type] + '</div></div>' +
          '<div class="collect-actions">' +
          '<button class="collect-btn paid' + (status === 'paid' ? ' active' : '') + '" data-status="paid">Paid</button>' +
          '<button class="collect-btn missed' + (status === 'missed' ? ' active' : '') + '" data-status="missed">Missed</button>' +
          '</div></div>';
      }).join('') : '<p style="padding:20px 4px;color:var(--muted);font-size:13.5px">No recurring customers assigned yet.</p>';
      document.getElementById('todayList').innerHTML = listHtml;

      Array.prototype.forEach.call(document.querySelectorAll('.collect-btn'), function (btn) {
        btn.addEventListener('click', function () {
          var row = btn.closest('.collect-row');
          var planId = row.getAttribute('data-plan-id');
          var status = btn.getAttribute('data-status');
          btn.closest('.collect-actions').style.opacity = '0.5';
          apiFetch('/agent/api/collections', { method: 'POST', body: JSON.stringify({ planId: planId, status: status }) })
            .then(function () { renderAgentDashboard(agent); })
            .catch(function () { btn.closest('.collect-actions').style.opacity = ''; });
        });
      });

      document.getElementById('fixedTableBody').innerHTML = oneTime.length ? oneTime.map(function (r) {
        return '<tr><td class="name-cell">' + r.userName + '</td><td>' + formatINR(r.amount) + '</td>' +
          '<td>' + new Date(r.startedAt.replace(' ', 'T') + 'Z').toLocaleDateString('en-IN') + '</td></tr>';
      }).join('') : '<tr class="empty-row"><td colspan="3">No one-time investments assigned.</td></tr>';
    });
  }

  route();
})();

</script>
</body>
</html>
